<div class="container">
  <app-section-head
    index="04"
    label="Capabilities"
    title="Seven disciplines, one accountable team."
    lede="Most providers sell you a tier and route you to whoever is free. We staff a named pod against your estate and keep the same engineers on it."
  />

  <ul class="rows">
    @for (item of items; track item.id; let i = $index) {
      <li class="row" [class.is-open]="open() === i" appReveal [revealDelay]="i * 50">
        <h3 class="row__headwrap">
          <button
            type="button"
            class="row__head"
            (click)="toggle(i)"
            [attr.aria-expanded]="open() === i"
            [attr.aria-controls]="'cap-panel-' + i"
            [id]="'cap-trigger-' + i"
          >
            <span class="row__index mono">{{ item.index }}</span>
            <span class="row__title display-2">{{ item.title }}</span>
            <span class="row__summary body-dim">{{ item.summary }}</span>
            <span class="row__toggle" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="15" height="15">
                <path d="M8 1v14" class="row__toggle-v" stroke="currentColor" stroke-width="1.4" />
                <path d="M1 8h14" stroke="currentColor" stroke-width="1.4" />
              </svg>
            </span>
          </button>
        </h3>

        <div
          class="row__panel"
          [id]="'cap-panel-' + i"
          role="region"
          [attr.aria-labelledby]="'cap-trigger-' + i"
          [attr.inert]="open() === i ? null : ''"
        >
          <div class="row__panel-in">
            <p class="row__detail">{{ item.detail }}</p>

            <div class="row__deliverables">
              <p class="mono row__deliverables-label">Included</p>
              <ul>
                @for (d of item.deliverables; track d) {
                  <li>
                    <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
                      <path
                        d="M2 8.5 6 12.5 14 4"
                        stroke="currentColor"
                        stroke-width="1.7"
                        fill="none"
                      />
                    </svg>
                    {{ d }}
                  </li>
                }
              </ul>
              <a routerLink="/services" [fragment]="item.id" class="link row__link">
                Full breakdown
                <span aria-hidden="true">→</span>
              </a>
            </div>
          </div>
        </div>
      </li>
    }
  </ul>
</div>
